name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "refactor/**"
      - "ci/**"
      - "test/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        run: go test ./...

      - name: Run API vet
        run: go vet ./...

  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/simulation/go.mod
          cache-dependency-path: apps/simulation/go.sum

      - name: Run simulation tests
        run: go test ./...

      - name: Run simulation vet
        run: go vet ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API contract types
        run: npm run api:types

      - name: Verify generated API types are committed
        working-directory: .
        run: git diff --exit-code apps/web/src/shared/api/generated/schema.ts

      - name: Validate API JSON schemas
        run: npm run api:validate-schemas

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/simulation/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start simulation service
        run: |
          (cd apps/simulation && SIM_HOST=127.0.0.1 SIM_PORT=8081 go run ./cmd/simulation) > /tmp/simulation.log 2>&1 &
          echo $! > /tmp/simulation.pid

      - name: Start API service
        run: |
          (cd apps/api && API_HTTP_HOST=127.0.0.1 API_HTTP_PORT=8080 SIMULATION_ENABLED=true SIMULATION_BASE_URL=http://127.0.0.1:8081 go run ./cmd/api) > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for backend services
        run: |
          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in {1..60}; do
              if curl -fsS "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready"
            echo "--- simulation log ---"
            cat /tmp/simulation.log || true
            echo "--- api log ---"
            cat /tmp/api.log || true
            return 1
          }

          wait_for_url http://127.0.0.1:8081/health simulation
          wait_for_url http://127.0.0.1:8080/health api

      - name: Run Playwright smoke tests
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_API_RUNTIME_VALIDATION: strict
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Collect backend service logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp /tmp/api.log e2e-logs/api.log || true
          cp /tmp/simulation.log e2e-logs/simulation.log || true

      - name: Upload backend service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-logs/
          retention-days: 7
