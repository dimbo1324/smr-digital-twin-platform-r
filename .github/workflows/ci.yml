name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
      - "ci/**"
      - "test/**"
      - "epic/**"
      - "hardening/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: |
            apps/api/go.sum
            apps/simulation/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run generated artifact guard
        run: node scripts/check-generated-artifacts.mjs

      - name: Run gofmt check
        run: node scripts/check-gofmt.mjs

      - name: Run go mod tidy check
        run: node scripts/check-go-mod-tidy.mjs

      - name: Run frontend format check
        working-directory: apps/web
        run: npm run format:check

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        run: go test ./...

      - name: Run API vet
        run: go vet ./...

      - name: Run API race tests
        run: go test -race ./...

      - name: Run API coverage summary
        run: go test -cover ./...

  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: apps/simulation/go.sum

      - name: Run simulation tests
        run: go test ./...

      - name: Run simulation vet
        run: go vet ./...

      - name: Run simulation race tests
        run: go test -race ./...

      - name: Run simulation coverage summary
        run: go test -cover ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API contract types
        run: npm run api:types

      - name: Verify generated API types are committed
        working-directory: .
        run: git diff --exit-code apps/web/src/shared/api/generated/schema.ts

      - name: Validate OpenAPI document
        run: npm run api:validate-openapi

      - name: Validate API JSON schemas
        run: npm run api:validate-schemas

      - name: Validate runtime contract coverage
        run: npm run api:validate-contract-coverage

      - name: Run frontend format check
        run: npm run format:check

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend component tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  security-dependencies:
    name: Security / Dependencies
    runs-on: ubuntu-latest
    needs: [api, simulation, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go for API scan
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: |
            apps/api/go.sum
            apps/simulation/go.sum

      - name: Run API govulncheck
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run simulation govulncheck
        working-directory: apps/simulation
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Set up Node for frontend audit
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies for audit
        working-directory: apps/web
        run: npm ci

      - name: Run frontend dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  e2e:
    name: E2E Browser
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: |
            apps/api/go.sum
            apps/simulation/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox

      - name: Start simulation service
        run: |
          (cd apps/simulation && SIM_HOST=127.0.0.1 SIM_PORT=8081 go run ./cmd/simulation) > /tmp/simulation.log 2>&1 &
          echo $! > /tmp/simulation.pid

      - name: Start API service
        run: |
          (cd apps/api && API_HTTP_HOST=127.0.0.1 API_HTTP_PORT=8080 SIMULATION_ENABLED=true SIMULATION_BASE_URL=http://127.0.0.1:8081 go run ./cmd/api) > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for backend services
        run: |
          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in {1..60}; do
              if curl -fsS "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready"
            echo "--- simulation log ---"
            cat /tmp/simulation.log || true
            echo "--- api log ---"
            cat /tmp/api.log || true
            return 1
          }

          wait_for_url http://127.0.0.1:8081/health simulation
          wait_for_url http://127.0.0.1:8080/health api

      - name: Run Playwright browser regression suite
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_API_RUNTIME_VALIDATION: strict
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Run Playwright multi-browser smoke suite
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_API_RUNTIME_VALIDATION: strict
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e:multi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Collect backend service logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp /tmp/api.log e2e-logs/api.log || true
          cp /tmp/simulation.log e2e-logs/simulation.log || true

      - name: Upload backend service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-logs/
          retention-days: 7

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: |
            apps/api/go.sum
            apps/simulation/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start simulation service
        run: |
          (cd apps/simulation && SIM_HOST=127.0.0.1 SIM_PORT=8081 go run ./cmd/simulation) > /tmp/simulation-visual.log 2>&1 &
          echo $! > /tmp/simulation-visual.pid

      - name: Start API service
        run: |
          (cd apps/api && API_HTTP_HOST=127.0.0.1 API_HTTP_PORT=8080 SIMULATION_ENABLED=true SIMULATION_BASE_URL=http://127.0.0.1:8081 go run ./cmd/api) > /tmp/api-visual.log 2>&1 &
          echo $! > /tmp/api-visual.pid

      - name: Wait for backend services
        run: |
          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in {1..60}; do
              if curl -fsS "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready"
            echo "--- simulation log ---"
            cat /tmp/simulation-visual.log || true
            echo "--- api log ---"
            cat /tmp/api-visual.log || true
            return 1
          }

          wait_for_url http://127.0.0.1:8081/health simulation
          wait_for_url http://127.0.0.1:8080/health api

      - name: Run Playwright visual regression suite
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_API_RUNTIME_VALIDATION: strict
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:visual

      - name: Upload visual Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Collect visual backend service logs
        if: failure()
        run: |
          mkdir -p visual-logs
          cp /tmp/api-visual.log visual-logs/api.log || true
          cp /tmp/simulation-visual.log visual-logs/simulation.log || true

      - name: Upload visual backend service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-service-logs
          path: visual-logs/
          retention-days: 7

  historian-db-smoke:
    name: Historian DB Smoke
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run historian DB integration smoke
        run: node scripts/smoke/historian-db-smoke.mjs --timeout-ms 300000 --history-wait-ms 90000

      - name: Collect historian smoke logs
        if: failure()
        run: |
          mkdir -p historian-smoke-logs
          if [ ! -s historian-smoke-logs/compose-ps.txt ]; then
            docker compose -p smr-twin-historian-smoke ps > historian-smoke-logs/compose-ps.txt 2>&1 || true
          fi
          if [ ! -s historian-smoke-logs/compose-logs.txt ]; then
            docker compose -p smr-twin-historian-smoke logs --tail=300 api simulation postgres > historian-smoke-logs/compose-logs.txt 2>&1 || true
          fi

      - name: Upload historian smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historian-smoke-logs
          path: |
            logs/smoke/
            historian-smoke-logs/
          retention-days: 7

      - name: Cleanup historian smoke stack
        if: always()
        run: docker compose -p smr-twin-historian-smoke down -v --remove-orphans

  observability-smoke:
    name: Observability Smoke
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run observability smoke
        run: node scripts/smoke/observability-smoke.mjs --timeout-ms 300000

      - name: Upload observability smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observability-smoke-logs
          path: logs/smoke/
          retention-days: 7

      - name: Cleanup observability smoke stack
        if: always()
        run: docker compose -p smr-twin-observability-smoke --profile observability down -v --remove-orphans

  load-soak:
    name: Load and Soak Baseline
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose, observability-smoke]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run short load-and-soak baseline
        run: node scripts/smoke/load-and-soak-baseline.mjs --duration-ms 180000 --warmup-ms 30000 --timeout-ms 420000

      - name: Upload load-and-soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-soak-logs
          path: logs/smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup load-and-soak stack
        if: always()
        run: docker compose -p smr-twin-load-soak --profile observability down -v --remove-orphans

  mqtt-smoke:
    name: MQTT Bridge Smoke
    runs-on: ubuntu-latest
    needs: [api, simulation, web, compose, historian-db-smoke, observability-smoke, load-soak]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run MQTT bridge smoke
        run: node scripts/smoke/mqtt-bridge-smoke.mjs --timeout-ms 300000

      - name: Upload MQTT smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-smoke-logs
          path: logs/smoke/
          retention-days: 7

      - name: Cleanup MQTT smoke stack
        if: always()
        run: docker compose -p smr-twin-mqtt-smoke down -v --remove-orphans
