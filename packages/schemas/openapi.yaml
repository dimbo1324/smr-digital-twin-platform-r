{
  "openapi": "3.1.0",
  "info": {
    "title": "SMR Twin Platform API",
    "version": "0.1.0",
    "description": "Simulation-only API for the SMR Twin Platform digital twin simulator. No real plant control."
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Local API Gateway"
    }
  ],
  "tags": [
    { "name": "Health" },
    { "name": "System" },
    { "name": "Assets" },
    { "name": "Telemetry" },
    { "name": "Commands" },
    { "name": "Alarms" },
    { "name": "Events" },
    { "name": "Scenarios" }
  ],
  "paths": {
    "/health": {
      "get": {
        "tags": ["Health"],
        "summary": "Read API health",
        "responses": {
          "200": {
            "description": "API health response",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HealthResponse" }
              }
            }
          }
        }
      }
    },
    "/api/v1/system/status": {
      "get": {
        "tags": ["System"],
        "summary": "Read platform and integration status",
        "responses": {
          "200": {
            "description": "Current platform status",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SystemStatusResponse" }
              }
            }
          },
          "500": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/assets": {
      "get": {
        "tags": ["Assets"],
        "summary": "List simulation assets",
        "responses": {
          "200": {
            "description": "Assets returned from simulation or labelled fallback memory source",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AssetsResponse" }
              }
            }
          },
          "500": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/telemetry/latest": {
      "get": {
        "tags": ["Telemetry"],
        "summary": "Read latest telemetry points",
        "responses": {
          "200": {
            "description": "Latest telemetry points for SMR unit overview and thermal process loop",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TelemetryLatestResponse" }
              }
            }
          },
          "500": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/telemetry/history": {
      "get": {
        "tags": ["Telemetry"],
        "summary": "Read in-memory telemetry history snapshots",
        "parameters": [
          {
            "name": "window",
            "in": "query",
            "required": false,
            "description": "History window supported by the simulation service.",
            "schema": { "type": "string", "enum": ["5m", "15m", "30m", "1h"], "default": "15m" }
          }
        ],
        "responses": {
          "200": {
            "description": "In-memory telemetry snapshots",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TelemetryHistoryResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/commands": {
      "post": {
        "tags": ["Commands"],
        "summary": "Submit a simulation-only command",
        "description": "Commands mutate only in-memory simulation state for V-101 and P-101. They do not control real equipment.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CommandRequest" },
              "examples": {
                "valveSetPosition": {
                  "value": {
                    "targetTag": "V-101",
                    "commandType": "SET_POSITION",
                    "payload": { "positionPercent": 75 }
                  }
                },
                "pumpStart": {
                  "value": {
                    "targetTag": "P-101",
                    "commandType": "START",
                    "payload": { "reason": "operator_demo" }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Command accepted, rejected, completed, or failed by the simulation service",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CommandResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/commands/recent": {
      "get": {
        "tags": ["Commands"],
        "summary": "List recent in-memory command records",
        "responses": {
          "200": {
            "description": "Recent command records",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CommandsResponse" }
              }
            }
          },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/events/recent": {
      "get": {
        "tags": ["Events"],
        "summary": "List recent unified in-memory events",
        "responses": {
          "200": {
            "description": "Recent command, alarm, equipment, and simulation events",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/EventsResponse" }
              }
            }
          },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/alarms/active": {
      "get": {
        "tags": ["Alarms"],
        "summary": "List active and acknowledged alarms",
        "responses": {
          "200": {
            "description": "Active or acknowledged alarm instances that are not cleared",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AlarmsResponse" }
              }
            }
          }
        }
      }
    },
    "/api/v1/alarms/history": {
      "get": {
        "tags": ["Alarms"],
        "summary": "List cleared in-memory alarm history",
        "responses": {
          "200": {
            "description": "Cleared alarm instances from in-memory history",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AlarmsResponse" }
              }
            }
          }
        }
      }
    },
    "/api/v1/alarms/{alarmID}/acknowledge": {
      "post": {
        "tags": ["Alarms"],
        "summary": "Acknowledge an active simulation alarm",
        "parameters": [
          {
            "name": "alarmID",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/AcknowledgeAlarmRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Acknowledged alarm instance",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AlarmResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/simulation/scenarios": {
      "get": {
        "tags": ["Scenarios"],
        "summary": "List predefined synthetic simulation scenarios",
        "responses": {
          "200": {
            "description": "Predefined simulation scenarios",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ScenariosResponse" }
              }
            }
          },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/simulation/scenarios/{scenarioName}/start": {
      "post": {
        "tags": ["Scenarios"],
        "summary": "Start a predefined synthetic scenario",
        "parameters": [
          {
            "name": "scenarioName",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": {
            "description": "Updated simulation status",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SimulationStatusResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Error" },
          "502": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/simulation/scenarios/stop": {
      "post": {
        "tags": ["Scenarios"],
        "summary": "Stop the active synthetic scenario",
        "responses": {
          "200": {
            "description": "Updated simulation status",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SimulationStatusResponse" }
              }
            }
          },
          "502": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/v1/simulation/reset": {
      "post": {
        "tags": ["Scenarios"],
        "summary": "Reset the in-memory simulation",
        "responses": {
          "200": {
            "description": "Updated simulation status after reset",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SimulationStatusResponse" }
              }
            }
          },
          "502": { "$ref": "#/components/responses/Error" }
        }
      }
    }
  },
  "components": {
    "responses": {
      "Error": {
        "description": "Standard API error response",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorResponse" }
          }
        }
      }
    },
    "schemas": {
      "ApiMeta": {
        "type": "object",
        "properties": {
          "requestId": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "count": { "type": "integer" },
          "source": { "type": "string" },
          "degraded": { "type": "boolean" }
        },
        "required": ["timestamp"],
        "additionalProperties": false
      },
      "ApiError": {
        "type": "object",
        "properties": {
          "code": { "type": "string" },
          "message": { "type": "string" }
        },
        "required": ["code", "message"],
        "additionalProperties": false
      },
      "ErrorResponse": {
        "type": "object",
        "properties": {
          "error": { "$ref": "#/components/schemas/ApiError" },
          "meta": { "$ref": "#/components/schemas/ApiMeta" }
        },
        "required": ["error", "meta"],
        "additionalProperties": false
      },
      "HealthResponse": {
        "type": "object",
        "properties": {
          "status": { "type": "string", "example": "ok" },
          "service": { "type": "string", "example": "smr-api" },
          "version": { "type": "string", "example": "0.1.0" },
          "environment": { "type": "string", "example": "development" },
          "uptimeSeconds": { "type": "integer" },
          "timestamp": { "type": "string", "format": "date-time" }
        },
        "required": ["status", "service", "version", "environment", "uptimeSeconds", "timestamp"],
        "additionalProperties": false
      },
      "ComponentStatus": {
        "type": "object",
        "properties": {
          "status": { "type": "string" },
          "latencyMs": { "type": "integer" }
        },
        "required": ["status"],
        "additionalProperties": false
      },
      "SystemStatus": {
        "type": "object",
        "properties": {
          "platform": { "type": "string" },
          "mode": { "type": "string", "description": "Current platform mode. The MVP uses simulation_only." },
          "environment": { "type": "string" },
          "controlBoundary": { "type": "string", "description": "The MVP uses no_live_control." },
          "dataSource": { "type": "string", "description": "Honest source label such as synthetic_simulation or in_memory_fallback." },
          "backendApi": { "$ref": "#/components/schemas/ComponentStatus" },
          "mqttBroker": { "$ref": "#/components/schemas/ComponentStatus" },
          "simulationService": { "$ref": "#/components/schemas/ComponentStatus" },
          "historian": { "$ref": "#/components/schemas/ComponentStatus" },
          "simulationConnected": { "type": "boolean" },
          "simulationMode": { "type": "string" },
          "simulationHealth": { "type": "string" },
          "lastSimulationTimestamp": { "type": "string" },
          "safetyDisclaimer": { "type": "string" },
          "version": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" }
        },
        "required": ["platform", "mode", "environment", "controlBoundary", "dataSource", "backendApi", "mqttBroker", "simulationService", "historian", "simulationConnected", "safetyDisclaimer", "version", "timestamp"],
        "additionalProperties": false
      },
      "AssetMetric": {
        "type": "object",
        "properties": {
          "name": { "type": "string" },
          "value": { "type": "number" },
          "unit": { "type": "string" }
        },
        "required": ["name", "value", "unit"],
        "additionalProperties": false
      },
      "AssetMetadata": {
        "type": "object",
        "properties": {
          "site": { "type": "string" },
          "unit": { "type": "string" }
        },
        "additionalProperties": { "type": "string" }
      },
      "Asset": {
        "type": "object",
        "properties": {
          "id": { "type": "string" },
          "tag": { "type": "string" },
          "name": { "type": "string" },
          "type": { "type": "string" },
          "status": { "type": "string" },
          "area": { "type": "string" },
          "unit": { "type": "string" },
          "safetyClass": { "type": "string" },
          "description": { "type": "string" },
          "metadata": { "$ref": "#/components/schemas/AssetMetadata" },
          "keyMetrics": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/AssetMetric" }
          },
          "updatedAt": { "type": "string", "format": "date-time" }
        },
        "required": ["id", "tag", "name", "type", "status"],
        "additionalProperties": false
      },
      "TelemetryPoint": {
        "type": "object",
        "properties": {
          "tag": { "type": "string" },
          "name": { "type": "string" },
          "value": { "type": "number" },
          "valueText": { "type": "string" },
          "unit": { "type": "string" },
          "quality": { "type": "string", "enum": ["GOOD", "BAD", "UNCERTAIN"] },
          "timestamp": { "type": "string", "format": "date-time" },
          "source": { "type": "string" },
          "area": { "type": "string" },
          "assetTag": { "type": "string" },
          "metadata": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": ["tag", "name", "unit", "quality", "timestamp", "source"],
        "additionalProperties": false
      },
      "TelemetrySnapshot": {
        "type": "object",
        "properties": {
          "reactorPowerPct": { "type": "number" },
          "thermalPowerMw": { "type": "number" },
          "electricPowerMw": { "type": "number" },
          "primaryTemperatureC": { "type": "number" },
          "secondaryTemperatureC": { "type": "number" },
          "primaryPressureMPa": { "type": "number" },
          "secondaryPressureMPa": { "type": "number" },
          "coolantFlowPct": { "type": "number" },
          "steamGeneratorLevelPct": { "type": "number" },
          "turbineRpm": { "type": "number" },
          "generatorLoadPct": { "type": "number" },
          "condenserVacuumKPa": { "type": "number" },
          "feedwaterFlowPct": { "type": "number" },
          "vibrationMmS": { "type": "number" },
          "radiationLevelUSvH": { "type": "number" },
          "availabilityPct": { "type": "number" },
          "efficiencyPct": { "type": "number" },
          "loopTemperatureC": { "type": "number" },
          "loopPressureMPa": { "type": "number" },
          "loopFlowKgS": { "type": "number" },
          "tankLevelPct": { "type": "number" },
          "valvePositionPct": { "type": "number" },
          "valveState": { "type": "string" },
          "pumpState": { "type": "string" },
          "pumpRpm": { "type": "number" },
          "heatExchangerState": { "type": "string" },
          "pidControllerMode": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "mode": { "type": "string" },
          "health": { "type": "string" },
          "simulationOnly": { "type": "boolean" },
          "scenario": { "type": "string" }
        },
        "required": ["reactorPowerPct", "thermalPowerMw", "electricPowerMw", "primaryTemperatureC", "secondaryTemperatureC", "primaryPressureMPa", "secondaryPressureMPa", "coolantFlowPct", "steamGeneratorLevelPct", "turbineRpm", "generatorLoadPct", "condenserVacuumKPa", "feedwaterFlowPct", "vibrationMmS", "radiationLevelUSvH", "availabilityPct", "efficiencyPct", "loopTemperatureC", "loopPressureMPa", "loopFlowKgS", "tankLevelPct", "valvePositionPct", "valveState", "pumpState", "pumpRpm", "heatExchangerState", "pidControllerMode", "timestamp", "mode", "health", "simulationOnly", "scenario"],
        "additionalProperties": false
      },
      "CommandPayload": {
        "type": "object",
        "properties": {
          "positionPercent": { "type": "number", "minimum": 0, "maximum": 100 },
          "reason": { "type": "string" }
        },
        "additionalProperties": false
      },
      "CommandRequest": {
        "type": "object",
        "properties": {
          "targetTag": { "type": "string", "enum": ["V-101", "P-101"] },
          "commandType": { "type": "string", "enum": ["OPEN", "CLOSE", "STOP", "SET_POSITION", "START"] },
          "source": { "type": "string" },
          "requestedBy": { "type": "string" },
          "payload": { "$ref": "#/components/schemas/CommandPayload" },
          "correlationId": { "type": "string" }
        },
        "required": ["targetTag", "commandType"],
        "additionalProperties": false
      },
      "Command": {
        "type": "object",
        "properties": {
          "id": { "type": "string" },
          "targetTag": { "type": "string", "enum": ["V-101", "P-101"] },
          "commandType": { "type": "string", "enum": ["OPEN", "CLOSE", "STOP", "SET_POSITION", "START"] },
          "source": { "type": "string", "enum": ["frontend", "api", "scenario", "system"] },
          "requestedBy": { "type": "string" },
          "payload": { "$ref": "#/components/schemas/CommandPayload" },
          "status": { "type": "string", "enum": ["RECEIVED", "ACCEPTED", "REJECTED", "IN_PROGRESS", "COMPLETED", "FAILED"] },
          "requestedAt": { "type": "string", "format": "date-time" },
          "acceptedAt": { "type": "string", "format": "date-time" },
          "completedAt": { "type": "string", "format": "date-time" },
          "rejectedAt": { "type": "string", "format": "date-time" },
          "resultMessage": { "type": "string" },
          "errorCode": { "type": "string" },
          "errorMessage": { "type": "string" },
          "correlationId": { "type": "string" }
        },
        "required": ["id", "targetTag", "commandType", "source", "requestedBy", "payload", "status", "requestedAt"],
        "additionalProperties": false
      },
      "AlarmInstance": {
        "type": "object",
        "properties": {
          "id": { "type": "string" },
          "ruleId": { "type": "string" },
          "assetId": { "type": "string" },
          "tag": { "type": "string" },
          "code": { "type": "string" },
          "title": { "type": "string" },
          "message": { "type": "string" },
          "severity": { "type": "string", "enum": ["INFO", "WARNING", "HIGH", "ALARM", "CRITICAL"] },
          "status": { "type": "string", "enum": ["ACTIVE", "ACKNOWLEDGED", "CLEARED"] },
          "value": { "type": "number" },
          "lastValue": { "type": "number" },
          "threshold": { "type": "number" },
          "unit": { "type": "string" },
          "source": { "type": "string" },
          "startedAt": { "type": "string", "format": "date-time" },
          "activeAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" },
          "acknowledgedAt": { "type": "string", "format": "date-time" },
          "acknowledgedBy": { "type": "string" },
          "clearedAt": { "type": "string", "format": "date-time" },
          "metadata": {
            "type": "object",
            "additionalProperties": { "type": "string" }
          }
        },
        "required": ["id", "ruleId", "assetId", "tag", "code", "title", "message", "severity", "status", "value", "lastValue", "threshold", "unit", "source", "startedAt", "activeAt", "updatedAt"],
        "additionalProperties": false
      },
      "AcknowledgeAlarmRequest": {
        "type": "object",
        "properties": {
          "acknowledgedBy": { "type": "string" },
          "comment": { "type": "string" }
        },
        "additionalProperties": false
      },
      "Event": {
        "type": "object",
        "properties": {
          "id": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "type": {
            "type": "string",
            "enum": ["COMMAND_RECEIVED", "COMMAND_ACCEPTED", "COMMAND_REJECTED", "COMMAND_STARTED", "COMMAND_COMPLETED", "COMMAND_FAILED", "EQUIPMENT_STATE_CHANGED", "ALARM_ACTIVATED", "ALARM_ACKNOWLEDGED", "ALARM_CLEARED", "SYSTEM_STATUS_CHANGED", "SIMULATION_STATE_UPDATED", "SCENARIO_STARTED", "SCENARIO_COMPLETED"]
          },
          "source": { "type": "string" },
          "severity": { "type": "string", "enum": ["INFO", "WARNING", "ERROR", "CRITICAL"] },
          "targetTag": { "type": "string" },
          "commandId": { "type": "string" },
          "alarmId": { "type": "string" },
          "message": { "type": "string" },
          "metadata": {
            "type": "object",
            "additionalProperties": { "type": "string" }
          }
        },
        "required": ["id", "timestamp", "type", "source", "severity", "message"],
        "additionalProperties": false
      },
      "Scenario": {
        "type": "object",
        "properties": {
          "name": { "type": "string" },
          "title": { "type": "string" },
          "description": { "type": "string" },
          "simulationOnly": { "type": "boolean" }
        },
        "required": ["name", "title", "description", "simulationOnly"],
        "additionalProperties": false
      },
      "SimulationStatus": {
        "type": "object",
        "properties": {
          "running": { "type": "boolean" },
          "mode": { "type": "string" },
          "health": { "type": "string" },
          "activeScenario": { "type": "string" },
          "tickMs": { "type": "integer" },
          "historySize": { "type": "integer" },
          "snapshotCount": { "type": "integer" },
          "lastSimulationTimestamp": { "type": "string" },
          "simulationOnly": { "type": "boolean" }
        },
        "required": ["running", "mode", "health", "activeScenario", "tickMs", "historySize", "snapshotCount", "lastSimulationTimestamp", "simulationOnly"],
        "additionalProperties": false
      },
      "SystemStatusResponse": {
        "type": "object",
        "properties": {
          "data": { "$ref": "#/components/schemas/SystemStatus" },
          "meta": { "$ref": "#/components/schemas/ApiMeta" }
        },
        "required": ["data", "meta"],
        "additionalProperties": false
      },
      "AssetsResponse": {
        "type": "object",
        "properties": {
          "data": { "type": "array", "items": { "$ref": "#/components/schemas/Asset" } },
          "meta": { "$ref": "#/components/schemas/ApiMeta" }
        },
        "required": ["data", "meta"],
        "additionalProperties": false
      },
      "TelemetryLatestResponse": {
        "type": "object",
        "properties": {
          "data": { "type": "array", "items": { "$ref": "#/components/schemas/TelemetryPoint" } },
          "meta": { "$ref": "#/components/schemas/ApiMeta" }
        },
        "required": ["data", "meta"],
        "additionalProperties": false
      },
      "TelemetryHistoryResponse": {
        "type": "object",
        "properties": {
          "data": { "type": "array", "items": { "$ref": "#/components/schemas/TelemetrySnapshot" } },
          "meta": { "$ref": "#/components/schemas/ApiMeta" }
        },
        "required": ["data", "meta"],
