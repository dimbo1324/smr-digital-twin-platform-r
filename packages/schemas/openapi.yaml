{
  "openapi": "3.1.0",
  "info": {
    "title": "SMR Twin Platform API",
    "version": "0.1.0",
    "description": "Simulation-only API for the SMR Twin Platform digital twin simulator. No real plant control."
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Local API Gateway"
    }
  ],
  "tags": [
    {
      "name": "Health"
    },
    {
      "name": "System"
    },
    {
      "name": "Assets"
    },
    {
      "name": "Telemetry"
    },
    {
      "name": "Commands"
    },
    {
      "name": "Control"
    },
    {
      "name": "Alarms"
    },
    {
      "name": "Events"
    },
    {
      "name": "Scenarios"
    },
    {
      "name": "Auth"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "Health"
        ],
        "summary": "Read API health",
        "responses": {
          "200": {
            "description": "API health response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/system/status": {
      "get": {
        "tags": [
          "System"
        ],
        "summary": "Read platform and integration status",
        "responses": {
          "200": {
            "description": "Current platform status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SystemStatusResponse"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/assets": {
      "get": {
        "tags": [
          "Assets"
        ],
        "summary": "List simulation assets",
        "responses": {
          "200": {
            "description": "Assets returned from simulation or labelled fallback memory source",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AssetsResponse"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/telemetry/latest": {
      "get": {
        "tags": [
          "Telemetry"
        ],
        "summary": "Read latest telemetry points",
        "responses": {
          "200": {
            "description": "Latest telemetry points for SMR unit overview and thermal process loop",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TelemetryLatestResponse"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/telemetry/history": {
      "get": {
        "tags": [
          "Telemetry"
        ],
        "summary": "Read in-memory telemetry history snapshots",
        "parameters": [
          {
            "name": "window",
            "in": "query",
            "required": false,
            "description": "History window supported by the simulation service.",
            "schema": {
              "type": "string",
              "enum": [
                "5m",
                "15m",
                "30m",
                "1h"
              ],
              "default": "15m"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "In-memory telemetry snapshots",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TelemetryHistoryResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/commands": {
      "post": {
        "tags": [
          "Commands"
        ],
        "summary": "Submit a simulation-only command",
        "description": "Commands mutate only in-memory simulation state for V-101 and P-101. They do not control real equipment.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CommandRequest"
              },
              "examples": {
                "valveSetPosition": {
                  "value": {
                    "targetTag": "V-101",
                    "commandType": "SET_POSITION",
                    "payload": {
                      "positionPercent": 75
                    }
                  }
                },
                "pumpStart": {
                  "value": {
                    "targetTag": "P-101",
                    "commandType": "START",
                    "payload": {
                      "reason": "operator_demo"
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Command accepted, rejected, completed, or failed by the simulation service",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CommandResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "422": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/commands/recent": {
      "get": {
        "tags": [
          "Commands"
        ],
        "summary": "List recent in-memory command records",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Maximum number of newest command records to return.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Recent command records",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CommandsResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/events/recent": {
      "get": {
        "tags": [
          "Events"
        ],
        "summary": "List recent unified in-memory events",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Maximum number of newest event records to return.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Recent command, alarm, equipment, and simulation events",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventsResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/alarms/active": {
      "get": {
        "tags": [
          "Alarms"
        ],
        "summary": "List active and acknowledged alarms",
        "responses": {
          "200": {
            "description": "Active or acknowledged alarm instances that are not cleared",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AlarmsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/alarms/history": {
      "get": {
        "tags": [
          "Alarms"
        ],
        "summary": "List cleared in-memory alarm history",
        "responses": {
          "200": {
            "description": "Cleared alarm instances from in-memory history",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AlarmsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/alarms/{alarmID}/acknowledge": {
      "post": {
        "tags": [
          "Alarms"
        ],
        "summary": "Acknowledge an active simulation alarm",
        "parameters": [
          {
            "name": "alarmID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AcknowledgeAlarmRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Acknowledged alarm instance",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AlarmResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/simulation/scenarios": {
      "get": {
        "tags": [
          "Scenarios"
        ],
        "summary": "List predefined synthetic simulation scenarios",
        "responses": {
          "200": {
            "description": "Predefined simulation scenarios",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenariosResponse"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/simulation/scenarios/{scenarioName}/start": {
      "post": {
        "tags": [
          "Scenarios"
        ],
        "summary": "Start a predefined synthetic scenario",
        "parameters": [
          {
            "name": "scenarioName",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Updated simulation status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulationStatusResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "502": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/simulation/scenarios/stop": {
      "post": {
        "tags": [
          "Scenarios"
        ],
        "summary": "Stop the active synthetic scenario",
        "responses": {
          "200": {
            "description": "Updated simulation status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulationStatusResponse"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "502": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/simulation/reset": {
      "post": {
        "tags": [
          "Scenarios"
        ],
        "summary": "Reset the in-memory simulation",
        "responses": {
          "200": {
            "description": "Updated simulation status after reset",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulationStatusResponse"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "502": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/control/status": {
      "get": {
        "tags": [
          "Control"
        ],
        "summary": "Read simulation-only control mode and authority status",
        "description": "Returns the TIC-101 control mode used by command arbitration for V-101. This is simulation-only and does not control real equipment.",
        "responses": {
          "200": {
            "description": "Current control mode status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlStatusResponse"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/control/mode": {
      "post": {
        "tags": [
          "Control"
        ],
        "summary": "Set simulation-only control mode",
        "description": "Switches TIC-101 between MANUAL, AUTO, and DISABLED in memory. AUTO reserves V-101 for the simulation-only TIC-101 PID controller.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ModeChangeRequest"
              },
              "examples": {
                "auto": {
                  "value": {
                    "mode": "AUTO",
                    "requestedBy": "demo-operator",
                    "reason": "Enable simulation-only PID demo"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated control status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlStatusResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/pid/status": {
      "get": {
        "tags": [
          "Control"
        ],
        "summary": "Get TIC-101 PID status",
        "responses": {
          "200": {
            "description": "Current simulation PID status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PIDStatusResponse"
                }
              }
            }
          },
          "503": {
            "description": "Simulation unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/pid/config": {
      "patch": {
        "tags": [
          "Control"
        ],
        "summary": "Update TIC-101 PID configuration",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PIDConfigUpdateRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated simulation PID status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PIDStatusResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid PID configuration",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "description": "Simulation unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/historian/status": {
      "get": {
        "tags": [
          "System"
        ],
        "summary": "Get simulation historian status",
        "description": "Returns PostgreSQL/TimescaleDB historian status for synthetic simulation data, or in-memory fallback status.",
        "responses": {
          "200": {
            "description": "Historian status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HistorianStatusResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/mqtt/status": {
      "get": {
        "tags": [
          "System"
        ],
        "summary": "Get simulation MQTT bridge status",
        "description": "Returns publish-only MQTT bridge status for synthetic simulation data. The bridge does not ingest MQTT commands and cannot control equipment.",
        "responses": {
          "200": {
            "description": "MQTT bridge status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MQTTStatusResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "tags": [
          "Auth"
        ],
        "summary": "Read current demo RBAC session",
        "description": "Resolves the current demo user from X-Demo-User or the default demo operator. Demo RBAC is not production authentication.",
        "responses": {
          "200": {
            "description": "Current demo auth session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthSessionResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/users": {
      "get": {
        "tags": [
          "Auth"
        ],
        "summary": "List available demo RBAC users",
        "description": "Returns static demo users for simulation-only role switching. No passwords or production identity provider are used.",
        "responses": {
          "200": {
            "description": "Demo user registry",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DemoUsersResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "responses": {
      "Error": {
        "description": "Standard API error response",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "ApiMeta": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "count": {
            "type": "integer"
          },
          "source": {
            "type": "string"
          },
          "degraded": {
            "type": "boolean"
          }
        },
        "required": [
          "timestamp"
        ],
        "additionalProperties": false
      },
      "ApiError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requiredPermission": {
            "type": "string"
          },
          "role": {
            "type": "string"
          },
          "simulationOnly": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "additionalProperties": false
      },
      "ErrorResponse": {
        "type": "object",
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ApiError"
          },
          "meta": {
            "$ref": "#/components/schemas/ApiMeta"
          }
        },
        "required": [
          "error",
          "meta"
        ],
        "additionalProperties": false
      },
      "HealthResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "example": "ok"
          },
          "service": {
            "type": "string",
            "example": "smr-api"
          },
          "version": {
            "type": "string",
            "example": "0.1.0"
          },
          "environment": {
            "type": "string",
            "example": "development"
          },
          "uptimeSeconds": {
            "type": "integer"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "status",
          "service",
          "version",
          "environment",
          "uptimeSeconds",
          "timestamp"
        ],
        "additionalProperties": false
      },
      "ComponentStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          },
          "latencyMs": {
            "type": "integer"
          }
        },
        "required": [
          "status"
        ],
        "additionalProperties": false
      },
      "SystemStatus": {
        "type": "object",
        "properties": {
          "platform": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "description": "Current platform mode. The MVP uses simulation_only."
          },
          "environment": {
            "type": "string"
          },
          "controlBoundary": {
            "type": "string",
            "description": "The MVP uses no_live_control."
          },
          "dataSource": {
            "type": "string",
            "description": "Honest source label such as synthetic_simulation or in_memory_fallback."
          },
          "backendApi": {
            "$ref": "#/components/schemas/ComponentStatus"
          },
          "mqttBroker": {
            "$ref": "#/components/schemas/ComponentStatus"
          },
          "simulationService": {
            "$ref": "#/components/schemas/ComponentStatus"
          },
          "historian": {
            "$ref": "#/components/schemas/ComponentStatus"
          },
          "simulationConnected": {
            "type": "boolean"
          },
          "simulationMode": {
            "type": "string"
          },
          "simulationHealth": {
            "type": "string"
          },
          "lastSimulationTimestamp": {
            "type": "string"
          },
          "safetyDisclaimer": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "platform",
          "mode",
          "environment",
          "controlBoundary",
          "dataSource",
          "backendApi",
          "mqttBroker",
          "simulationService",
          "historian",
          "simulationConnected",
          "safetyDisclaimer",
          "version",
          "timestamp"
        ],
        "additionalProperties": false
      },
      "AssetMetric": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "value": {
            "type": "number"
          },
          "unit": {
            "type": "string"
          }
        },
        "required": [
          "name",
          "value",
          "unit"
        ],
        "additionalProperties": false
      },
      "AssetMetadata": {
        "type": "object",
        "properties": {
          "site": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          }
        },
        "additionalProperties": {
          "type": "string"
        }
      },
      "Asset": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "tag": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "area": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          },
          "safetyClass": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "metadata": {
            "$ref": "#/components/schemas/AssetMetadata"
          },
          "keyMetrics": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AssetMetric"
            }
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "tag",
          "name",
          "type",
          "status"
        ],
        "additionalProperties": false
      },
      "TelemetryPoint": {
        "type": "object",
        "properties": {
          "tag": {
